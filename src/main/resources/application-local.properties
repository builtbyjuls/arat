spring.datasource.url=${ARAT_DATABASE_URL:jdbc:postgresql://localhost:5432/arat}
spring.datasource.username=${ARAT_DATABASE_USERNAME:arat}
spring.datasource.password=${ARAT_DATABASE_PASSWORD:arat}
arat.local.authentication.bearer-token=arat-local-owner-token
arat.local.authentication.principal-tokens.member=arat-local-member-token
arat.local.authentication.principal-tokens.outsider=arat-local-outsider-token
arat.invitation.token.active-key-id=local-test
arat.invitation.token.keys.local-test=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
management.endpoints.web.exposure.include=health,prometheus
