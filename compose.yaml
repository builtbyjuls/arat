services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${ARAT_DATABASE_NAME:-arat}
      POSTGRES_USER: ${ARAT_DATABASE_USERNAME:-arat}
      POSTGRES_PASSWORD: ${ARAT_DATABASE_PASSWORD:-arat}
    ports:
      - "127.0.0.1:${ARAT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - arat-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARAT_DATABASE_USERNAME:-arat} -d ${ARAT_DATABASE_NAME:-arat}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local,compose
      ARAT_DATABASE_URL: jdbc:postgresql://postgres:5432/${ARAT_DATABASE_NAME:-arat}
      ARAT_DATABASE_USERNAME: ${ARAT_DATABASE_USERNAME:-arat}
      ARAT_DATABASE_PASSWORD: ${ARAT_DATABASE_PASSWORD:-arat}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ARAT_APP_PORT:-8080}:8080"
    restart: on-failure

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=128MB
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ARAT_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - arat-prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  arat-postgres-data:
  arat-prometheus-data:
